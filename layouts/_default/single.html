{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="meta">{{ .Date.Format "January 2, 2006" }}{{ if .Params.tags }} · {{ range .Params.tags }}<span class="tag">{{ . }}</span> {{ end }}{{ end }}</p>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
