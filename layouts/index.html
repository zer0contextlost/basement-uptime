{{ define "main" }}
<section class="intro">
  <p class="intro-label">// {{ .Site.Title }}</p>
  <h1>{{ .Site.Params.description }}</h1>
</section>
<section class="post-list">
  <p class="list-label">$ ls ./posts</p>
  {{ range (where .Site.RegularPages "Type" "posts").ByDate.Reverse }}
  <article class="post-summary">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p class="meta">{{ .Date.Format "2006-01-02" }}</p>
    <p>{{ .Description }}</p>
  </article>
  {{ end }}
</section>
{{ end }}
